<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deadliner - Отчёты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #1e2846;
            color: #fff;
        }

        header {
            background: #3478dc;
            padding: 16px 32px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        main { padding: 32px; }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #2a3555;
            border-radius: 10px;
            padding: 20px 28px;
            flex: 1;
            text-align: center;
        }

        .stat-card .number {
            font-size: 48px;
            font-weight: bold;
            color: #3478dc;
        }

        .stat-card.red .number { color: #ef4444; }
        .stat-card.green .number { color: #22c55e; }

        .stat-card .label {
            font-size: 14px;
            color: #aab4d0;
            margin-top: 6px;
        }

        h2 { margin-bottom: 16px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a3555;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #3478dc;
            padding: 12px 16px;
            text-align: left;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #1e2846;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        a.btn {
            text-decoration: none;
            display: inline-block;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 24px;
        }

        .btn:hover {background: #2560b8;}

        .badge.red { background: #3d0f0f; color: #ef4444; }
        .badge.green { background: #14401e; color: #22c55e; }
        .badge.yellow { background: #3d3000; color: #eab308; }
    </style>
</head>
<body>

    <header>
    <span>Deadliner - Отчёты</span>
    <nav style="display:flex; gap:12px; align-items:center;">
        <a href="index.html" class="btn"> Заказы</a>
        <a href="workshop.html" class="btn"> Экран цеха</a>
    </nav>
    <div id="userInfo" style="display:flex; align-items:center; gap:8px; margin-left:auto;"></div>
</header>

    <main>
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalCount">—</div>
                <div class="label">Всего заказов</div>
            </div>
            <div class="stat-card green">
                <div class="number" id="doneCount">—</div>
                <div class="label">Завершено</div>
            </div>
            <div class="stat-card red">
                <div class="number" id="overdueCount">—</div>
                <div class="label">Просрочено</div>
            </div>
        </div>

        <h2>Все заказы</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Клиент</th>
                    <th>Дата приёма</th>
                    <th>Плановая отгрузка</th>
                    <th>Осталось дней</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="reportsTable"></tbody>
        </table>
    </main>

    <script src="auth.js"></script>
    <script src="reports.js"></script>
</body>
</html>
