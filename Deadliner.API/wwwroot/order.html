<!DOCTYPE html>
<html lang="ru" >
    <head>
        <meta charset="UTF-8">
        <title> Deadliner - новый заказ</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1e2846;
            color: #fff;
        }
        header {
            background: #3478dc;
            padding: 16px 32px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        main {
            padding: 32px;
            max-width: 600px;
        }
        h2 { margin-bottom: 24px; }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #aab4d0;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            background: #2a3555;
            border: 1px solid #3d4f7a;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3478dc;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            background: #3478dc;
            color: white;
            margin-top: 8px;
        }

        .btn:hover { background: #2560b8; }
        </style>
    </head>
    <body>
        
        <header>
            <button class="back-btn" onclick="history.back()"> ← Назад </button>
            <span> Новый заказ</span>
        </header>

        <main>
            <h2>Данные заказа</h2>

            <div class="form-group">
                <label> Клиент </label>
                <select id="clientId">
                    <option value=""> Выбрите клиента </option>
                </select>
            </div>

            <div class="form-group">
                <label>Менеджер</label>
                <select id="managerId">
                    <option value=""> Выберите менеджера</option>
                </select>

            </div>

            <div class="form-group">
                <label>Сумма предоплаты (Бел.Руб.)</label>
                <input type="number" id="prepayment" placeholder="0" min="0">
            </div>

            <div class="form-group">
                <label>Плановая дата отгрузки</label>
                <input type="date" id="shipDate">
            </div>

            <button class="btn" onclick="createOrder()">Создать заказ</button>
        </main>

        <script src="auth.js"></script>
        <script src="order.js"></script>
    </body>
</html>
