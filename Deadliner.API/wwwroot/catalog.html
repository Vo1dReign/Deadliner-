<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner - Справочник этапов цеха</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #1e2846;
            color: #fff;
        }

        header {
            background: #3478dc;
            padding: 16px 32px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            padding: 24px 32px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h2 { font-size: 20px; margin-bottom: 16px; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: #3478dc;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background: #2560b8; }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #b91c1c; }

        /* Форма добавления этапа */
        .card {
            background: #2a3555;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.5fr auto;
            gap: 12px;
            align-items: end;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #aab4d0;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background: #1e2846;
            border: 1px solid #3d4f7a;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3478dc;
        }

        /* Таблица этапов */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a3555;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #3478dc;
            padding: 12px 16px;
            text-align: left;
            font-size: 15px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #1e2846;
            font-size: 14px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-base { background: #14401e; color: #22c55e; }
        .badge-sub { background: #3d3000; color: #eab308; }
    </style>
</head>
<body>

    <header>
        <span>DeadLiner - Каталог операций цеха</span>
        <div id="userInfo" style="display:flex; align-items:center;"></div>
    </header>

    <main>
        <div class="top-bar">
            <a href="index.html" class="btn">← Назад к заказам</a>
            <h2>Справочник нормативных этапов производства</h2>
            <div></div>
        </div>
        
        <div class="card manager-only">
            <h2>➕ Добавить технологический этап</h2>
            <form id="addStageForm" class="form-grid" onsubmit="addStage(event)">
                <div class="form-group">
                    <label>Название этапа</label>
                    <input type="text" id="nazvanie" placeholder="Например: Шлифовка шпона" required>
                </div>
                <div class="form-group">
                    <label>№ по порядку</label>
                    <input type="number" id="poryadok" placeholder="1, 2, 3..." min="1" required>
                </div>
                <div class="form-group">
                    <label>Тип этапа</label>
                    <select id="tipEtapa">
                        <option value="базовый">Базовый</option>
                        <option value="промежуточный">Промежуточный</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ответственная роль</label>
                    <select id="rolSelect">
                        <option value="3">Сотрудник цеха</option>
                        <option value="2">Менеджер</option>
                        <option value="1">Администратор</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn btn-success">+ Сохранить</button>
                </div>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">Очередь</th>
                    <th>Наименование операции</th>
                    <th>Тип этапа</th>
                    <th>Ответственный участок (роль)</th>
                    <th style="width: 100px;">Действие</th>
                </tr>
            </thead>
            <tbody id="catalogTable">
                <tr><td colspan="5" style="text-align:center;">Загрузка справочника...</td></tr>
            </tbody>
        </table>
    </main>

    <script src="auth.js"></script>
    <script src="catalog.js"></script>
</body>
</html>
