<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner - Журнал аудита заказа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #1e2846;
            color: #fff;
        }

        header {
            background: #3478dc;
            padding: 16px 32px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            padding: 32px;
            max-width: 900px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h2 { font-size: 22px; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: #3478dc;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background: #2560b8; }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }

        /* Форма добавления заметки */
        .card {
            background: #2a3555;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 32px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: #1e2846;
            border: 1px solid #3d4f7a;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3478dc;
        }

        /* Хронологическая шкала (Timeline) */
        .timeline {
            position: relative;
            padding-left: 32px;
            border-left: 3px solid #3478dc;
            margin-left: 16px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 28px;
        }

        /* Точка на линии времени */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -40px;
            top: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #22c55e;
            border: 3px solid #1e2846;
        }

        .timeline-content {
            background: #2a3555;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aab4d0;
        }

        .timeline-author {
            color: #38bdf8;
            font-weight: bold;
        }

        .timeline-desc {
            font-size: 15px;
            line-height: 1.4;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <header>
        <span>DeadLiner - Аудит и история</span>
        <div id="userInfo" style="display:flex; align-items:center;"></div>
    </header>

    <main>
        <div class="top-bar">
            <a href="index.html" class="btn">← Назад к заказам</a>
            <h2 id="orderTitle">История изменений заказа...</h2>
            <div></div>
        </div>

        <div class="card manager-only">
            <h3 style="font-size: 16px;">📝 Внести примечание или фиксацию события</h3>
            <form onsubmit="addAuditNote(event)" class="input-row">
                <input type="text" id="noteText" placeholder="Например: Клиент подтвердил доставку на 15:00..." required>
                <button type="submit" class="btn btn-success">+ Записать</button>
            </form>
        </div>

        <!-- Лента событий -->
        <div class="timeline" id="timelineList">
            <div style="color: #aab4d0;">Загрузка хронологии заказа...</div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="audit.js"></script>
</body>
</html>
