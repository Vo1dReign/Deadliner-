<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner — Вход в систему</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #eff6ff 0%, #f8fafc 90%);
            padding: 24px;
        }

        .login-card {
            background: #ffffff;
            padding: 40px 36px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -15px rgba(37, 99, 235, 0.15), 0 1px 3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 440px;
            border-top: 5px solid var(--brand-primary);
        }

        .login-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .login-header .brand-icon {
            width: 48px;
            height: 48px;
            font-size: 22px;
            margin: 0 auto 14px auto;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-subtle);
            color: var(--text-main);
            font-size: 14.5px;
            font-family: inherit;
            transition: all 0.15s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #error {
            color: var(--status-red-text);
            background: var(--status-red-bg);
            border: 1px solid var(--status-red-border);
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            display: none;
            line-height: 1.4;
        }

        .demo-accounts {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px dashed var(--border);
        }

        .demo-accounts-title {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .demo-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .demo-pill {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .demo-pill:hover {
            background: #e0f2fe;
            border-color: #7dd3fc;
            color: #0369a1;
        }

        .demo-pill span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 11px;
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--brand-primary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
        }

        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="logo.png" alt="МикМебель" style="height: 48px; max-width: 150px; margin: 0 auto 12px auto; display: block; object-fit: contain;">
            <h2>DeadLiner MES</h2>
            <p>Авторизация в системе производственной диспетчеризации</p>
        </div>

        <form onsubmit="event.preventDefault(); doLogin();">
            <div class="form-group">
                <label for="login">Имя пользователя (логин или телефон)</label>
                <input id="login" placeholder="Например: admin или +375..." type="text" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="parol">Пароль доступа</label>
                <input id="parol" placeholder="••••••••" type="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-modern btn-primary btn-submit">Войти в систему</button>
        </form>
        
        <div id="error"></div>

        <div class="demo-accounts">
            <div class="demo-accounts-title">Быстрый тестовый вход (кликните):</div>
            <div class="demo-pills">
                <button type="button" class="demo-pill" onclick="fillCredentials('admin', 'admin123')">
                    👑 admin <span>(Ревенко Е. — Главный Администратор)</span>
                </button>
            </div>
        </div>
        
        <a href="register.html" class="register-link">Новый сотрудник? Зарегистрироваться</a>
    </div>

    <script src="login.js"></script>
</body>
</html>
