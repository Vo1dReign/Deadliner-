<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DeadLiner - Заказы</title>
        <style>
            * {margin: 0; padding: 0; box-sizing: border-box;}

            body {
                font-family: Arial, sans-serif;
                background: #1e2846;
                color: #fff;
            }

            header {
                background: #3478dc;
                padding: 16px 32px;
                font-size: 24px;
                font-weight: bold;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            main {
                padding: 24px 32px;
            }

            .header-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 16px;
            }

            h2 { font-size: 20px; }

            /* Панель фильтров и поиска */
            .filters-panel {
                display: flex;
                gap: 12px;
                margin-bottom: 20px;
                background: #2a3555;
                padding: 16px 20px;
                border-radius: 8px;
                align-items: center;
                flex-wrap: wrap;
            }

            .filters-panel input, .filters-panel select {
                padding: 9px 14px;
                background: #1e2846;
                border: 1px solid #3d4f7a;
                border-radius: 6px;
                color: #fff;
                font-size: 14px;
            }

            .filters-panel input {
                flex: 1;
                min-width: 260px;
            }

            .filters-panel input:focus, .filters-panel select:focus {
                outline: none;
                border-color: #3478dc;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                background: #2a3555;
                border-radius: 8px;
                overflow: hidden;
            }

            th {
                background: #3478dc;
                padding: 12px 16px;
                text-align: left;
                user-select: none;
                cursor: pointer;
            }

            th:hover {
                background: #2b67be;
            }

            th.no-sort {
                cursor: default;
            }
            th.no-sort:hover {
                background: #3478dc;
            }

            td {
                padding: 12px 16px;
                border-bottom: 1px solid #1e2846;
            }

            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                background: #3478dc;
                color: white;
                text-decoration: none;
                display: inline-block;
            }

            .btn:hover {background: #2560b8;}

            .btn-secondary { background: #475569; }
            .btn-secondary:hover { background: #334155; }

            .btn-danger { background: #ef4444; }
            .btn-danger:hover { background: #b91c1c; }

            .green {border-left: 5px solid #22c55e;}
            .yellow {border-left: 5px solid #eab308;}
            .red {border-left: 5px solid #ef4444;}

            .counter-text {
                font-size: 14px;
                color: #aab4d0;
            }
        </style>
    </head>

    <body>
        
        <header>
            <span> DeadLiner</span>
            <nav style="display:flex; gap:12px; align-items:center;">
                <a href="workshop.html" class="btn">Экран цеха</a>
                <a href="reports.html" class="btn manager-only">Отчёты</a>
                <a href="catalog.html" class="btn manager-only">Справочник цеха</a>
                <a href="settings.html" class="btn manager-only">Настройки</a>
                <button class="btn manager-only" onclick="openCreate()">+ Новый заказ</button>
                <div id="userInfo" style="display:flex; align-items:center; margin-left:16px;"></div>
            </nav>
        </header>

        <main>
            <div class="header-bar">
                <h2> Список производственных заказов </h2>
                <div id="ordersCount" class="counter-text">Загрузка...</div>
            </div>

            <div class="filters-panel">
                <input type="text" id="searchInput" placeholder="🔍 Быстрый поиск по номеру или клиенту..." oninput="applyFilters()">
                
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="">Все статусы</option>
                    <option value="в работе">В работе</option>
                    <option value="просрочен">Просрочен</option>
                    <option value="завершён">Завершён</option>
                </select>

                <select id="urgencyFilter" onchange="applyFilters()">
                    <option value="">Все зоны срочности</option>
                    <option value="green">🟢 Зеленая (штатный срок)</option>
                    <option value="yellow">🟡 Желтая (внимание)</option>
                    <option value="red">🔴 Красная (критично / просрочен)</option>
                </select>

                <button class="btn btn-secondary" onclick="resetFilters()">✕ Сброс</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('id')"># ⬍</th>
                        <th onclick="sortTable('klient')">Клиент ⬍</th>
                        <th onclick="sortTable('dataPriema')">Дата приёма ⬍</th>
                        <th onclick="sortTable('planDataOtgruzki')">Плановая отгрузка ⬍</th>
                        <th onclick="sortTable('daysLeft')">Осталось дней ⬍</th>
                        <th onclick="sortTable('status')">Статус ⬍</th>
                        <th class="no-sort">Действия</th>
                    </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </main>
        
        <script src="auth.js"></script>
        <script src="app.js"></script>
    </body>
</html>
