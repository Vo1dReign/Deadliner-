<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DeadLiner - Заказы</title>
        <style>
            * {margin: 0%; padding: 0%; box-sizing: border-box;}

            body {
                font-family: Arial, sans-serif;
                background: #1e2846;
                color: #fff;

            }

            header{
                background: #3478dc;
                padding: 16px 32px;
                font-size: 24px;
                font-weight: bold;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            main{
                padding: 24px 32px;
            }

            h2{
                margin-bottom: 16px;
                font-size: 20px;
            }

            table{
                width: 100%;
                border-collapse: collapse;
                background: #2a3555;
                border-radius: 8px;
                overflow: hidden;
            }

            th{
                background: #3478dc;
                padding: 12px 16px;
                text-align: left;
            }

            td{
                padding: 12px 16px;
                border-bottom: 1px solid #1e2846;
            }

            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                background: #3478dc;
                color: white;
            }

            a.btn {
                text-decoration: none;
                display: inline-block;
            }

            .btn:hover {background: #2560b8;}

            .btn-danger { background: #ef4444; }
            .btn-danger:hover { background: #b91c1c; }

            .green {border-left: 5px solid #22c55e;}
            .yellow {border-left: 5px solid #eab308;}
            .red {border-left: 5px solid #ef4444;}
        </style>
    </head>

    <body>
        
        <header>
            <span> DeadLiner</span>
                <nav style="display:flex; gap:12px; align-items:center;">
                <a href="workshop.html" class="btn">Экран цеха</a>
                <a href="reports.html" class="btn manager-only">Отчёты</a>
                <a href="catalog.html" class="btn manager-only">Справочник цеха</a>
                <a href="settings.html" class="btn manager-only">Настройки</a>
                <button class="btn manager-only" onclick="openCreate()">+ Новый заказ</button>
                <div id="userInfo" style="display:flex; align-items:center; margin-left:16px;"></div>
            </nav>
        </header>

        <main>
            <h2> Список заказов </h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Клиент</th>
                        <th>Дата приёма</th>
                        <th>Плановая отгрузка</th>
                        <th>Осталось дней</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
            </table>
        </main>
        <script src="auth.js"></script>
        <script src="app.js"></script>
    </body>
</html>
