<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deadliner - Экран цеха</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #0f1628;
            color: #fff;
        }

        header {
            background: #1e2846;
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 3px solid #3478dc;
        }

        #clock {
            font-size: 28px;
            font-weight: bold;
            color: #3478dc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 26px;
        }

        th {
            background: #1e2846;
            padding: 16px 24px;
            text-align: left;
            font-size: 18px;
            color: #aab4d0;
        }

        td {
            padding: 20px 24px;
            border-bottom: 2px solid #1e2846;
            font-weight: bold;
        }

        a.btn {
            text-decoration: none;
            display: inline-block;
        }

        .green { background: #14401e; border-left: 8px solid #22c55e; }
        .yellow { background: #3d3000; border-left: 8px solid #eab308; }
        .red { background: #3d0f0f; border-left: 8px solid #ef4444; }

        .days-left {
            font-size: 32px;
            font-weight: bold;
        }

        .overdue { color: #ef4444; }
    </style>
</head>
<body>

    <header>
    <span>Deadliner - Экран цеха</span>
    <nav style="display:flex; gap:12px; align-items:center;">
        <a href="index.html" class="btn">Заказы</a>
        <a href="reports.html" class="btn">Отчёты</a>
        <span id="clock">00:00:00</span>
    </nav>
</header>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Клиент</th>
                <th>Плановая отгрузка</th>
                <th>Осталось дней</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody id="workshopTable"></tbody>
    </table>

    <script src="workshop.js"></script>
</body>
</html>
