<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner — Цеховое информационное табло</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            color: #ffffff;
            min-height: 100vh;
            transition: cursor 0.2s ease;
        }

        body.hide-cursor {
            cursor: none;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        header {
            background: #0f172a;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1e293b;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-tag {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 6px;
            letter-spacing: 0.05em;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        #clock {
            font-size: 26px;
            font-weight: 800;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            background: #020617;
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
            font-family: inherit;
            transition: all 0.15s ease;
        }

        .btn-kiosk {
            background: #2563eb;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .btn-kiosk:hover { background: #1d4ed8; }

        .btn-sound {
            background: #334155;
            border: 1px solid #475569;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .btn-back {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .btn-back:hover { 
            background: #334155; 
            color: #ffffff;
            border-color: #64748b;
        }

        /* ==========================================================================
           ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ В ШАПКЕ ЦЕХА (КИОСК / ТЁМНАЯ ТЕМА)
           ========================================================================== */
        #userInfo {
            display: flex;
            align-items: center;
            margin-left: 6px;
        }

        #userInfo .user-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 4px 10px 4px 6px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        #userInfo .user-panel:hover {
            border-color: #475569;
            background: #243247;
        }

        #userInfo .user-details {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
        }

        #userInfo .avatar-box {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 7px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13.5px;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        #userInfo .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 7px;
            display: block;
        }

        #userInfo .user-text-name {
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            line-height: 1.25;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #userInfo .user-text-role {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: 0.02em;
        }

        #userInfo .logout-link-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            margin-left: 2px;
        }

        #userInfo .logout-link-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        /* Всплывающие уведомления (Toasts) в стиле тёмной темы */
        #toastContainer {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .custom-toast {
            min-width: 320px;
            max-width: 440px;
            background: #1e293b;
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            pointer-events: auto;
            animation: toastSlideIn 0.25s ease forwards;
        }

        .custom-toast.toast-hiding {
            animation: toastSlideOut 0.25s ease forwards;
        }

        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastSlideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(40px); }
        }

        .toast-icon { flex-shrink: 0; margin-top: 2px; }
        .toast-body { flex: 1; }
        .toast-title { font-size: 13.5px; font-weight: 700; color: #f8fafc; margin-bottom: 2px; }
        .toast-message { font-size: 12.5px; color: #94a3b8; line-height: 1.4; }
        .toast-close { background: none; border: none; color: #64748b; cursor: pointer; padding: 2px; }
        .toast-close:hover { color: #ffffff; }
        .toast-success { border-left: 4px solid #10b981; }
        .toast-error { border-left: 4px solid #ef4444; }
        .toast-warning { border-left: 4px solid #f59e0b; }
        .toast-info { border-left: 4px solid #38bdf8; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 22px;
        }

        th {
            background: #0f172a;
            padding: 16px 28px;
            text-align: left;
            font-size: 13.5px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 800;
            border-bottom: 2px solid #1e293b;
        }

        td {
            padding: 20px 28px;
            border-bottom: 1px solid #1e293b;
            font-weight: 700;
            vertical-align: middle;
        }

        .green {
            background: #082116;
            border-left: 8px solid #10b981;
        }

        .yellow {
            background: #241c05;
            border-left: 8px solid #f59e0b;
        }

        .red {
            background: #2c0b0e;
            border-left: 8px solid #ef4444;
            animation: pulse-red 2s infinite ease-in-out;
        }

        @keyframes pulse-red {
            0% { background-color: #2c0b0e; }
            50% { background-color: #451014; box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.5); }
            100% { background-color: #2c0b0e; }
        }

        .days-left {
            font-size: 26px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }

        .overdue {
            color: #ef4444;
            text-transform: uppercase;
            font-weight: 800;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <span class="brand-tag">ЦЕХ</span>
            <span class="brand-title">DeadLiner — Оперативное табло</span>
            <span id="clock">00:00:00</span>
        </div>
        
        <nav style="display:flex; gap:10px; align-items:center;">
            <a href="index.html" class="btn btn-back" title="Вернуться на главную страницу (Реестр заказов)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>На главную</span>
            </a>
            <button class="btn btn-kiosk" onclick="toggleFullScreen()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                </svg>
                <span>На весь экран</span>
            </button>
            <button class="btn btn-sound" id="soundBtn" onclick="toggleSound()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
                <span>Звук: Выкл</span>
            </button>
            <div id="userInfo"></div>
        </nav>
    </header>

    <table>
        <thead>
            <tr>
                <th style="width: 110px;">Заказ</th>
                <th>Контрагент</th>
                <th style="width: 220px;">План отгрузки</th>
                <th style="width: 240px;">Остаток срока</th>
                <th style="width: 200px;">Текущий статус</th>
            </tr>
        </thead>
        <tbody id="workshopTable"></tbody>
    </table>

    <script src="auth.js"></script>
    <script src="workshop.js"></script>
</body>
</html>
