<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner — Регистрация сотрудника</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #f8fafc 0%, #e2e8f0 90%);
            padding: 24px;
        }

        .register-card {
            background: var(--bg-card);
            padding: 40px 36px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            border-top: 5px solid var(--brand-primary);
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-header img {
            height: 46px;
            max-width: 140px;
            margin: 0 auto 10px auto;
            display: block;
            object-fit: contain;
        }

        .card-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }

        .card-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-subtle);
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.15s ease;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .phone-input-row {
            display: flex;
            gap: 8px;
        }

        .phone-input-row input {
            flex: 1;
        }

        .btn-send-code {
            padding: 0 14px;
            white-space: nowrap;
            font-size: 12.5px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-send-code:hover:not(:disabled) {
            background: #e0f2fe;
            border-color: #38bdf8;
            color: #0284c7;
        }

        .btn-send-code:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-verification-box {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-top: 8px;
        }

        .otp-verification-box.active {
            display: block;
        }

        .otp-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .otp-input-row input {
            width: 140px;
            letter-spacing: 4px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            background: #ffffff;
        }

        .btn-verify-otp {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            background: #16a34a;
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .btn-verify-otp:hover {
            background: #15803d;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #16a34a;
            font-size: 12.5px;
            font-weight: 700;
            margin-top: 4px;
        }

        .btn-register {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            margin-top: 14px;
            cursor: pointer;
        }

        .link-back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
        }

        .link-back:hover {
            color: var(--brand-primary);
            text-decoration: underline;
        }
    </style>
    <script src="theme.js"></script>
</head>
<body>
    <div class="register-card">
        <div class="card-header">
            <img src="logo.png" alt="МикМебель">
            <h2>Регистрация сотрудника <span class="badge-alpha">Alpha</span></h2>
            <p>ООО «МикМебель» • Защищённая регистрация в DeadLiner MES</p>
        </div>
        
        <div class="form-group">
            <label for="fio">ФИО сотрудника <span style="color:var(--status-red-text)">*</span></label>
            <input id="fio" placeholder="Например: Иванов Иван Иванович" type="text" required>
        </div>

        <div class="form-group">
            <label for="telefon">Номер телефона (для входа и 2FA) <span style="color:var(--status-red-text)">*</span></label>
            <div class="phone-input-row">
                <input id="telefon" placeholder="+375 (29) 000-00-00" type="tel" oninput="formatPhoneInput(this)">
                <button type="button" class="btn-send-code" id="btnSendSms" onclick="requestSmsCode()">
                    Получить код
                </button>
            </div>
            <div id="phoneVerifiedStatus" style="display:none;" class="verified-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Номер телефона подтверждён
            </div>

            <!-- Блок ввода проверочного SMS-кода -->
            <div id="otpBox" class="otp-verification-box">
                <div style="font-size: 12px; color: #166534; font-weight: 600; margin-bottom: 6px;">
                    Введите 4-значный проверочный SMS-код:
                </div>
                <div class="otp-input-row">
                    <input id="verificationCode" type="text" maxlength="4" placeholder="••••" autocomplete="one-time-code">
                    <button type="button" class="btn-verify-otp" onclick="confirmSmsCode()">Подтвердить</button>
                </div>
                <div id="smsTimerText" style="font-size: 11.5px; color: #4b5563; margin-top: 6px;"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="rol">Должность в компании <span style="color:var(--status-red-text)">*</span></label>
            <select id="rol">
                <option value="1003">Конструктор (Офис)</option>
                <option value="1002">Дизайнер (Офис)</option>
                <option value="1004">Бухгалтер (Офис)</option>
                <option value="1005">Начальник производства</option>
                <option value="1006">Логист</option>
                <option value="3">Сотрудник цеха (Станочник)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="login">Логин пользователя <span style="color:var(--status-red-text)">*</span></label>
            <input id="login" placeholder="ivanov_ii" type="text" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label for="parol">Пароль (хэшируется алгоритмом PBKDF2) <span style="color:var(--status-red-text)">*</span></label>
            <input id="parol" placeholder="Минимум 6 знаков" type="password" autocomplete="new-password" required>
        </div>

        <button class="btn-modern btn-primary btn-register" id="btnSubmitRegister" onclick="registerUser()">Зарегистрировать аккаунт</button>
        <a href="login.html" class="link-back">← Вернуться ко входу</a>

        <div class="card-company-footer" style="text-align: center; margin-top: 20px; font-size: 11.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 14px; display: flex; justify-content: center; align-items: center; gap: 8px;">
            <span>ООО «МикМебель» 2011–2026</span>
            <span>•</span>
            <span class="footer-tag" style="font-size:10px;">Альфа-версия v1.0</span>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="register.js"></script>
</body>
</html>
