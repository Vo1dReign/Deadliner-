<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner — Регистрация сотрудника</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #eff6ff 0%, #f8fafc 90%);
            padding: 24px;
        }

        .register-card {
            background: #ffffff;
            padding: 40px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -15px rgba(37, 99, 235, 0.15), 0 1px 3px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 460px;
            border-top: 5px solid var(--brand-purple);
        }

        .card-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .card-header .brand-icon {
            width: 44px;
            height: 44px;
            font-size: 20px;
            margin: 0 auto 14px auto;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
        }

        .card-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }

        .card-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-subtle);
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.15s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--brand-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .btn-register {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            margin-top: 10px;
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
        }

        .link-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
        }

        .link-back:hover {
            color: var(--brand-primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="card-header">
            <div class="brand-icon">D</div>
            <h2>Регистрация сотрудника</h2>
            <p>Создание учётной записи в системе DeadLiner</p>
        </div>
        
        <div class="form-group">
            <label for="fio">ФИО сотрудника</label>
            <input id="fio" placeholder="Например: Иванов Иван Иванович" type="text" required>
        </div>

        <div class="form-group">
            <label for="telefon">Контактный номер телефона</label>
            <input id="telefon" placeholder="+375 (29) 000-00-00" type="text">
        </div>

        <div class="form-group">
            <label for="rol">Должность в компании</label>
            <select id="rol">
                <option value="1">Администратор</option>
                <option value="2">Менеджер</option>
                <option value="3">Сотрудник цеха</option>
                <option value="1002">Дизайнер</option>
                <option value="1003">Конструктор</option>
                <option value="1004">Бухгалтер</option>
                <option value="1005">Начальник производства</option>
                <option value="1006">Логист</option>
            </select>
        </div>

        <div class="form-group">
            <label for="login">Логин пользователя</label>
            <input id="login" placeholder="ivanov_ii" type="text" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label for="parol">Пароль учётной записи</label>
            <input id="parol" placeholder="Минимум 6 знаков" type="password" autocomplete="new-password" required>
        </div>

        <button class="btn-modern btn-primary btn-register" onclick="registerUser()">Зарегистрировать</button>
        <a href="login.html" class="link-back">← Вернуться ко входу</a>
    </div>

    <script src="auth.js"></script>
    <script src="register.js"></script>
</body>
</html>
