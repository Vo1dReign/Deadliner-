<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner - Изделия</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}

        body {
            font-family: Arial, sans-serif;
            background: #1e2846;
            color: #fff;
        }

        header {
            background: #3478dc;
            padding: 16px 32px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main { padding: 24px 32px; }

        h2 { margin-bottom: 16px; font-size: 20px; }

        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        input {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: #2a3555;
            color: #fff;
            font-size: 14px;
        }

        input::placeholder { color: #aaa; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a3555;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #3478dc;
            padding: 12px 16px;
            text-align: left;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #1e2846;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: #3478dc;
            color: white;
        }

        a.btn { text-decoration: none; display: inline-block; }
        .btn:hover { background: #2560b8; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #b91c1c; }
    </style>
</head>
<body>

<header>
    <span>DeadLiner</span>
    <nav style="display:flex; gap:12px;">
        <a href="index.html" class="btn">Заказы</a>
        <a href="workshop.html" class="btn">Экран цеха</a>
        <a href="reports.html" class="btn">Отчёты</a>
    </nav>
</header>

<main>
    <h2 id="title">Изделия заказа</h2>

    <div class="form-row">
        <input id="naimenovanie" placeholder="Наименование (Шкаф-купе)" style="width:260px;">
        <input id="kolichestvo" type="number" placeholder="Кол-во" value="1" min="1" style="width:100px;">
        <input id="harakteristiki" placeholder="Характеристики (2000x800x600, белый)" style="width:300px;">
        <button class="btn" onclick="addItem()">+ Добавить</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Наименование</th>
                <th>Количество</th>
                <th>Характеристики</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="itemsTable"></tbody>
    </table>
</main>

<script src="items.js"></script>
</body>
</html>
