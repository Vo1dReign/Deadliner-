<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadLiner - Технологические этапы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #1e2846;
            color: #fff;
        }

        header {
            background: #3478dc;
            padding: 16px 32px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            padding: 24px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h2 { font-size: 22px; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: #3478dc;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background: #2560b8; }
        .btn-success { background: #22c55e; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; }

        /* Прогресс-бар этапов */
        .progress-box {
            background: #2a3555;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .progress-title {
            font-size: 16px;
            color: #aab4d0;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .progress-track {
            display: flex;
            gap: 8px;
            background: #1e2846;
            padding: 8px;
            border-radius: 6px;
        }

        .progress-step {
            flex: 1;
            padding: 10px 8px;
            text-align: center;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            background: #3d4f7a;
            color: #ccc;
        }

        .progress-step.done {
            background: #22c55e;
            color: white;
        }

        .progress-step.current {
            background: #eab308;
            color: #1e2846;
        }

        /* Таблица этапов */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a3555;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #3478dc;
            padding: 12px 16px;
            text-align: left;
            font-size: 15px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #1e2846;
            font-size: 15px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-green { background: #14401e; color: #22c55e; border: 1px solid #22c55e; }
        .badge-yellow { background: #3d3000; color: #eab308; border: 1px solid #eab308; }
        .badge-gray { background: #1e2846; color: #94a3b8; border: 1px solid #3d4f7a; }
    </style>
</head>
<body>

    <header>
        <span>DeadLiner - Технологическая карта</span>
        <div id="userInfo" style="display:flex; align-items:center;"></div>
    </header>

    <main>
        <div class="top-bar">
            <a href="index.html" class="btn">← Назад к заказам</a>
            <h2 id="orderTitle">Загрузка данных заказа...</h2>
            <div></div>
        </div>


        <div class="progress-box">
            <div class="progress-title">
                <span>Прогресс выполнения технологического маршрута</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track" id="progressTrack">

            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Операция (этап)</th>
                    <th>Тип</th>
                    <th>План. срок</th>
                    <th>Факт. завершение</th>
                    <th>Статус</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="stagesTable">
                <tr><td colspan="7" style="text-align:center;">Загрузка этапов...</td></tr>
            </tbody>
        </table>
    </main>

    <script src="auth.js"></script>
    <script src="stages.js"></script>
</body>
</html>
